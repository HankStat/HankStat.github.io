baseURL: "https://HankStat.github.io/"
outputs:
  home:
    - HTML
    - RSS
    - JSON
title: "Hank Chen"
pagination:
  pagerSize: 5
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Hank Chen"
  description: "Master of Computer Science @ UIUC"
  keywords: [Distributed Systems, Machine Learning, Go, Python]
  author: "Hank Chen"
  # images: ["<link to your image>"]
  dateFormat: "January 2, 2006"
  defaultTheme: auto
  
  profileMode:
    enabled: true
    title: "Hi, I'm Hank 🗣️"
    subtitle: "MCS @ UIUC"
    imageUrl: "https://github.com/HankStat.png"
    imageWidth: 120
    imageHeight: 120
    imageTitle: "Hank Chen"
    buttons:
      - name: Resume
        url: "/Hank_Chen_SWE_Resume.pdf"
      - name: Projects
        url: "/projects"
      - name: Blog
        url: "/posts"

  socialIcons:
    - name: github
      url: "https://github.com/HankStat"
    - name: linkedin
      url: "https://www.linkedin.com/in/yong-han-chen/"
    - name: email
      url: "mailto:hank96015@gmail.com"

  assets:
    favicon: "https://github.com/HankStat.png"
    favicon16x16: "https://github.com/HankStat.png"
    favicon32x32: "https://github.com/HankStat.png"
    apple_touch_icon: "https://github.com/HankStat.png"

  comments: true 
  giscus:
    repo: "HankStat/HankStat.github.io"
    category: "General"
    categoryID: "DIC_kwDOQaJC8c4CyEp2"
    mapping: "pathname"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    theme: "preferred_color_scheme"
    lang: "en"

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: posts
      name: Blog
      url: /posts/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
markup:
  goldmark:
    renderer:
      unsafe: true